# Render Blueprint: the public GhostCache walkthrough as a static site.
# It publishes only site/ (HTML, CSS, JS and data exported from recorded reports).
# No server, database, worker, model or secret: the local app and live Gemma stay on the laptop.
# Regenerate site/data/evidence.json locally with `python3.12 scripts/export_site_data.py` and commit it.
services:
  - type: web
    runtime: static
    name: ghostcache-walkthrough
    buildCommand: echo "No build step; site/ is committed static files"
    staticPublishPath: ./site
    buildFilter:
      paths:
        - site/**
        - render.yaml
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /data/*
        name: Cache-Control
        value: no-cache
